<!DOCTYPE html>
<html>

<head>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
  <nav class="navbar navbar-expand-lg navbar-light" style="background-color: #e3f2fd;">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('home')}}">
  <img src="{{ url_for('static', filename='images/tfl_logo.jpg') }}" alt="" width="80" height="30" class="d-inline-block align-text-top">
  </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
      <div class="navbar-nav">
        <a class="nav-link" href="{{ url_for('loginOptions')}}">Home</a>
        <a class="nav-link" href="{{ url_for('login')}}">Login</a>
        <a class="nav-link" href="{{ url_for('signup')}}">Sign Up</a>
        <a class="nav-link" href="{{ url_for('traindelays')}}">Train Status</a>
      </div>
    </div>
  </div>
</nav>

    <div class="mx-auto" style="width: 500px;">
     <h1>Error:</h1>
</head>
<body>
    <div class="container-fluid"></div>
    <div class="mx-auto" style="width: 500px;">
        <p class="text-break" >An error has occured, please press on the button below to return to the home page.</p>

    </div>

    {% if response_status_code == 404 %}
    <a href="{{ url_for('home')}}">
        <button type="button" class="btn btn-primary btn-lg">Return to home</button>
     </a>
    <img src="{{ url_for('static', filename='images/error_page2.jpg') }}"
         class="img-fluid"
         alt="Error page 2">
         
     {% elif loginFail==True %}
     <a href="{{ url_for('loginOptions2')}}">
          <button type="button" class="btn btn-primary btn-lg">Return to login page</button>
     </a>
     <img src="{{ url_for('static', filename='images/error_page3.jpg') }}"
         class="img-fluid"
         alt="Error page 3">
    {% else %}
    <a href="{{ url_for('home')}}">
        <button type="button" class="btn btn-primary btn-lg">Return to home</button>
     </a>
    <img src="{{ url_for('static', filename='images/error_page1.jpg') }}"
         class="img-fluid"
         alt="Error page 1">
    {% endif %}


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    </div>
</body>

</html>
