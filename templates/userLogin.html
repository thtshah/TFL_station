    <div class="mx-auto" style="width: 500px;">
     <h1>TFL - Login:</h1>

</head>


<body class="bg-light">
    <div class="container-fluid"></div>
    <div class="mx-auto" style="width: 500px;">
        <form action="{{ url_for('accountManagement') }}" method="post">
            <div> 
                <label for="username_or_email" class="form-label">Please enter your username or email:</label>
                <input name="username_or_email" class="form-control" id="username_or_email" placeholder="Username or example@example.com" required>
            </div>

            <div> 
                <label for="password" class="form-label">Please enter your password:</label>
                <input type="password" name=password class="form-control" id="password" placeholder="Password" required>
            </div>
            
            <p> </p>
            
            {% if loginFail==True %}
            <p class="text-danger"> 
                !!! USERNAME OR PASSWORD IS WRONG !!! 
                Please try again. </p>
            {% endif %}

            <p> </p>

            <button type="submit" class="btn btn-success">Submit</button>
            <a href="{{ url_for('loginOptions2') }}" class="btn btn-primary">Back to Login Options</a>
            </form>

                <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
                
    </div>
        </form>
</body>

</html>
